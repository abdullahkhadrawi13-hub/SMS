<button
  type="button"
  class="language-button"
  [class.compact]="compact()"
  (click)="switchLanguage()">

  <mat-icon class="language-icon" aria-hidden="true">translate</mat-icon>

  <!-- compact (the phone navbar): the icon only. The name stays in the
       button for screen readers, hidden on screen. -->
  <span class="language-name" [attr.lang]="otherLanguage()">{{ otherLanguageName() }}</span>

</button>
