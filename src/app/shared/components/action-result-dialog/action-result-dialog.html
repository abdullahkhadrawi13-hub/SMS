<!-- The same shape as the shared confirm dialog: an icon in a circle,
     the title, one paragraph, then one button at the end. -->
<div class="result" [attr.data-type]="data.type">

  <div class="result-body">

    <span class="result-icon" aria-hidden="true">
      <mat-icon>{{ config.icon }}</mat-icon>
    </span>

    <h2 mat-dialog-title>
      {{ config.titleKey | translate }}
    </h2>

    <mat-dialog-content>
      <p>{{ data.message }}</p>
    </mat-dialog-content>

  </div>

  <mat-dialog-actions>

    <button
      mat-flat-button
      type="button"
      cdkFocusInitial
      (click)="close()"
    >
      {{ 'SHARED.ACTION_RESULT.OK' | translate }}
    </button>

  </mat-dialog-actions>

</div>
