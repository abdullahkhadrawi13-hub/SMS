<div class="action-result-dialog">

  <div class="result-icon" [class]="data.type">
    <mat-icon>
      {{ config.icon }}
    </mat-icon>
  </div>

  <h2 class="result-title">
    {{ config.titleKey | translate }}
  </h2>

  <p class="result-message">
    {{ data.message }}
  </p>

  <button
    mat-flat-button
    type="button"
    (click)="close()"
  >
    {{ 'SHARED.ACTION_RESULT.OK' | translate }}
  </button>

</div>
