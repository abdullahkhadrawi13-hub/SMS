<!-- The direction is set here (not only on <html>): mat-sidenav reads it
     from the nearest [dir], so position="start" flips at once when the
     language changes (right in Arabic, left in English). -->
<div class="dashboard-layout" [dir]="languageService.getDirection()">

  <!-- Keyboard: the first Tab shows this link, and Enter jumps over the
       sidebar links straight to the page. Hidden until it has focus. -->
  <a class="skip-link" href="#main-content" (click)="skipToContent($event)">
    {{ 'SHARED.SKIP_TO_CONTENT' | translate }}
  </a>

  <mat-sidenav-container class="layout-container">

    <!-- Sidebar
         Computer (720px and wider): mode="side", always open, as before.
         Phone (under 720px): mode="over", closed until the navbar menu
         button opens it. It closes on the backdrop, on Escape (both built
         into mat-sidenav) and when a link is clicked. -->
    <mat-sidenav
      #sidenav
      class="sidebar-container"
      position="start"
      [mode]="isPhone() ? 'over' : 'side'"
      [opened]="sidebarOpened()"
      (openedChange)="sidebarOpened.set($event)"
      [autoFocus]="isPhone() ? 'first-tabbable' : false">

      <!-- The phone: the sidebar closes first, then the page opens
           (holdNavigation + navigateAfterClose). -->
      <app-sidebar
        [holdNavigation]="isPhone()"
        (linkClick)="onSidebarLinkClick()"
        (navigateAfterClose)="closeThenNavigate($event)">
      </app-sidebar>

    </mat-sidenav>


    <!-- Main Area -->
    <mat-sidenav-content class="main-area">

      <!-- Navbar -->
      <app-navbar
        [phone]="isPhone()"
        (menuClick)="openSidebar()">
      </app-navbar>

      <!-- Content: the only place with the page padding -->
      <main class="content-area" id="main-content" tabindex="-1" #mainContent>
        <router-outlet></router-outlet>
      </main>

    </mat-sidenav-content>

  </mat-sidenav-container>

</div>
