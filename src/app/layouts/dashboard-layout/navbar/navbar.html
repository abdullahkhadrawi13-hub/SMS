<mat-toolbar class="navbar" [class.phone]="phone()">

  <!-- The logo and the system name are in the sidebar.
       Everything here sits at the end of the bar, in this order:
       current term → language → user.
       On the phone (under 720px) the bar is navy: the menu button at the
       start, then the language icon and the avatar at the end. -->

  @if (phone()) {
    <button
      type="button"
      class="menu-button"
      (click)="menuClick.emit()"
      [attr.aria-label]="'NAVBAR.OPEN_MENU' | translate">
      <mat-icon aria-hidden="true">menu</mat-icon>
    </button>
  }

  <span class="spacer"></span>

  <!-- Created only for Admin and AssistantPrincipal:
       the others get 403 on the academic terms list.
       Not shown on the phone (no room). -->
  @if (showCurrentTerm() && !phone()) {
    <app-current-term-badge />
  }

  <app-language-switcher [compact]="phone()" />


  <!-- User button: avatar + name (first + family) + role.
       The role colors come from role-colors.ts through the CSS variables
       --role-main (avatar background) and --role-dark (initials). -->
  <button
    type="button"
    class="user-button"
    [class.open]="userTrigger.menuOpen"
    [matMenuTriggerFor]="userMenu"
    #userTrigger="matMenuTrigger"
    [attr.aria-label]="'NAVBAR.USER_MENU' | translate"
    [style.--role-main]="roleColor().main"
    [style.--role-dark]="roleColor().dark">

    @if (user()) {

      <span class="avatar" aria-hidden="true">{{ initials() }}</span>

      <span class="user-text">
        <span class="user-name">{{ shortName() }}</span>
        <span class="user-role">{{ roleKey() | translate }}</span>
      </span>

    } @else {

      <mat-icon class="avatar-icon" aria-hidden="true">account_circle</mat-icon>

      <span class="user-text">
        <span class="user-name">{{ 'NAVBAR.USER' | translate }}</span>
      </span>

    }

    <mat-icon class="caret" aria-hidden="true">expand_more</mat-icon>

  </button>

</mat-toolbar>


<!-- user-menu-panel: width, border and shadow of the panel are in styles.css
     (the panel opens outside this component). -->
<mat-menu
  #userMenu="matMenu"
  xPosition="before"
  class="user-menu-panel">

  <!-- Menu header: avatar + name + login ID -->
  @if (user(); as currentUser) {

    <div
      class="menu-head"
      [style.--role-main]="roleColor().main"
      [style.--role-dark]="roleColor().dark">

      <span class="avatar large" aria-hidden="true">{{ initials() }}</span>

      <div class="menu-head-text">
        <span class="menu-head-name">{{ shortName() }}</span>
        <bdi class="menu-head-login">{{ currentUser.loginId }}</bdi>
      </div>

    </div>

    <div class="menu-divider"></div>

  }


  <button
    mat-menu-item
    (click)="openProfile()">

    <mat-icon aria-hidden="true">person</mat-icon>

    <span>
      {{ 'NAVBAR.PROFILE' | translate }}
    </span>

  </button>


  <button
    mat-menu-item
    (click)="openChangePassword()">

    <mat-icon aria-hidden="true">lock</mat-icon>

    <span>
      {{ 'NAVBAR.CHANGE_PASSWORD' | translate }}
    </span>

  </button>


  <div class="menu-divider"></div>


  <button
    mat-menu-item
    class="logout-item"
    (click)="logout()">

    <mat-icon aria-hidden="true">logout</mat-icon>

    <span>
      {{ 'NAVBAR.LOGOUT' | translate }}
    </span>

  </button>

</mat-menu>
