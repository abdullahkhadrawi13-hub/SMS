<mat-toolbar class="navbar">

  <div class="navbar-brand">

    <img
      src="images/sms-logo.jpg"
      alt="SMS Logo">

    <span>
      {{ 'NAVBAR.TITLE' | translate }}
    </span>

  </div>

  <span class="spacer"></span>

  <app-language-switcher></app-language-switcher>


  <!-- User button: avatar + name (first + family) + role.
       The role color comes from role-colors.ts through the CSS variables
       --role-main / --role-soft / --role-dark, used in navbar.css. -->
  <button
    type="button"
    class="user-button"
    [class.open]="userTrigger.menuOpen"
    [matMenuTriggerFor]="userMenu"
    #userTrigger="matMenuTrigger"
    [attr.aria-label]="'NAVBAR.USER_MENU' | translate"
    [style.--role-main]="roleColor().main">

    @if (user()) {

      <span class="avatar" aria-hidden="true">{{ initials() }}</span>

      <span class="user-text">
        <span class="user-name">{{ shortName() }}</span>
        <span class="user-role">{{ roleKey() | translate }}</span>
      </span>

    } @else {

      <mat-icon class="avatar-icon">account_circle</mat-icon>

      <span class="user-text">
        <span class="user-name">{{ 'NAVBAR.USER' | translate }}</span>
      </span>

    }

    <mat-icon class="caret">expand_more</mat-icon>

  </button>

</mat-toolbar>


<mat-menu #userMenu="matMenu" xPosition="before">

  <!-- Menu header: avatar + name + login ID -->
  @if (user(); as currentUser) {

    <div
      class="menu-head"
      [style.--role-main]="roleColor().main">

      <span class="avatar large" aria-hidden="true">{{ initials() }}</span>

      <div class="menu-head-text">
        <span class="menu-head-name">{{ shortName() }}</span>
        <bdi class="menu-head-login">{{ currentUser.loginId }}</bdi>
      </div>

    </div>

    <div class="menu-divider"></div>

  }


  <button
    mat-menu-item
    (click)="openProfile()">

    <mat-icon>person</mat-icon>

    <span>
      {{ 'NAVBAR.PROFILE' | translate }}
    </span>

  </button>


  <button
    mat-menu-item
    (click)="openChangePassword()">

    <mat-icon>lock</mat-icon>

    <span>
      {{ 'NAVBAR.CHANGE_PASSWORD' | translate }}
    </span>

  </button>


  <div class="menu-divider"></div>


  <button
    mat-menu-item
    class="logout-item"
    (click)="logout()">

    <mat-icon>logout</mat-icon>

    <span>
      {{ 'NAVBAR.LOGOUT' | translate }}
    </span>

  </button>

</mat-menu>
