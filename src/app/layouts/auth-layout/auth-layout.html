<div class="auth-page">

  <!-- اللوحة الكحلية: نفس مكان الشريط الجانبي بعد الدخول -->
  <aside class="brand-panel">

    <div class="brand">

      <img
        src="/images/sms-emblem.png"
        alt=""
        class="emblem">

      <span class="brand-name">
        {{ 'AUTH.SYSTEM_NAME' | translate }}
      </span>

      <!-- زر اللغة على الهاتف (اللوحة تصبح شريطًا علويًا) -->
      <div class="panel-language">
        <app-language-switcher />
      </div>

    </div>

    <div class="brand-main">

      <p class="brand-title">
        {{ 'AUTH.SYSTEM_NAME' | translate }}
      </p>

      <p class="brand-description">
        {{ 'AUTH.DESCRIPTION' | translate }}
      </p>

      <!-- قواعد حقيقية من النظام -->
      <ul class="facts">

        <li>
          <mat-icon aria-hidden="true">admin_panel_settings</mat-icon>
          <span>{{ 'AUTH.FACT_ACCOUNTS' | translate }}</span>
        </li>

        <li>
          <mat-icon aria-hidden="true">key</mat-icon>
          <span>{{ 'AUTH.FACT_TEMP_PASSWORD' | translate }}</span>
        </li>

        <li>
          <mat-icon aria-hidden="true">translate</mat-icon>
          <span>{{ 'AUTH.FACT_LANGUAGE' | translate }}</span>
        </li>

      </ul>

    </div>

  </aside>


  <!-- النموذج (تسجيل الدخول أو تغيير كلمة المرور) -->
  <main class="auth-main">

    <div class="main-language">
      <app-language-switcher />
    </div>

    <div class="auth-content">

      <div class="auth-form">
        <router-outlet />
      </div>

    </div>

  </main>

</div>
