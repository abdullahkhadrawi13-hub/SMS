<div class="attendance-page">

  <!-- Page Header -->
  <app-attendance-header></app-attendance-header>

  <!-- Tabs: Admin, Assistant Principal and the attendance officer.
       (The attendance officer sees the summary and the absentees of today only.)
       The active tab is kept in the URL: ?tab=summary / ?tab=absentees -->
  @if (canViewSummary()) {
    <nav
      mat-tab-nav-bar
      mat-stretch-tabs="false"
      class="attendance-tabs"
      [tabPanel]="tabPanel"
    >

      <a
        mat-tab-link
        [active]="activeTab() === 'record'"
        (click)="selectTab('record')"
      >
        <span class="tab-label">
          <mat-icon>edit_note</mat-icon>

          <span>
            {{ 'ATTENDANCE.TABS.RECORD' | translate }}
          </span>
        </span>
      </a>

      <a
        mat-tab-link
        [active]="activeTab() === 'summary'"
        (click)="selectTab('summary')"
      >
        <span class="tab-label">
          <mat-icon>insights</mat-icon>

          <span>
            {{ 'ATTENDANCE.TABS.SUMMARY' | translate }}
          </span>
        </span>
      </a>

      @if (canViewAbsentees()) {
        <a
          mat-tab-link
          [active]="activeTab() === 'absentees'"
          (click)="selectTab('absentees')"
        >
          <span class="tab-label">
            <mat-icon>person_off</mat-icon>

            <span>
              {{ 'ATTENDANCE.TABS.ABSENTEES' | translate }}
            </span>
          </span>
        </a>
      }

    </nav>
  }

  <!-- The three tabs stay alive while switching ([hidden], not @if),
       so the unsaved marks and the absentees search are not lost. -->
  <mat-tab-nav-panel #tabPanel>

    <!-- Record attendance: class / section / date, then the sheet -->
    <div [hidden]="activeTab() !== 'record'">
      <app-record-tab></app-record-tab>
    </div>

    <!-- Daily summary: sections recorded and absent students per section -->
    @if (canViewSummary()) {
      <div [hidden]="activeTab() !== 'summary'">
        <app-daily-summary-tab
          [reloadKey]="summaryReloadKey()"
          (openSheet)="openSheet($event)"
        ></app-daily-summary-tab>
      </div>
    }

    <!-- Absent students with their parents' phone numbers -->
    @if (canViewAbsentees()) {
      <div [hidden]="activeTab() !== 'absentees'">
        <app-absentees-tab
          [reloadKey]="absenteesReloadKey()"
          (openSheet)="openSheet($event)"
        ></app-absentees-tab>
      </div>
    }

  </mat-tab-nav-panel>

</div>
