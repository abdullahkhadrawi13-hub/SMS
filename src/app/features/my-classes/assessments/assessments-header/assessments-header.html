<!-- The header of the assessments page: "My classes" back link, the subject,
     the plan state badge next to it, and class · section · term under it.
     Before the assignment arrives, the title is just "Assessments". -->
<app-page-header
  [title]="subjectName()
    ? ('MY_CLASSES.ASSESSMENTS.HEADER.TITLE' | translate: { subject: subjectName() })
    : ('MY_CLASSES.ASSESSMENTS.HEADER.FALLBACK_TITLE' | translate)"
  backLink="/my-classes"
  [backLabel]="'MY_CLASSES.HEADER.TITLE' | translate"
>

  @if (planBadge(); as badge) {
    <app-status-badge badge [tone]="badge.tone" [icon]="badge.icon">
      {{ badge.labelKey | translate }}
    </app-status-badge>
  }

  @if (subjectName()) {
    <span subtitle>
      {{ className() }}
      <span class="sep" aria-hidden="true">·</span>
      {{ 'MY_CLASSES.CARD.SECTION' | translate: { name: sectionName() } }}

      @if (termName()) {
        <span class="sep" aria-hidden="true">·</span>
        {{ termName() }}
      }
    </span>
  }

</app-page-header>
