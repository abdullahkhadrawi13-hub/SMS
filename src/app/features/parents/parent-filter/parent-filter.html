<!-- Dialog title -->
<h2 mat-dialog-title>
  {{ 'PARENTS.FILTER.TITLE' | translate }}
</h2>

<!-- Filter content -->
<mat-dialog-content>

  <div class="filter-form">

    <!-- Parent account status filter -->
    <mat-form-field appearance="outline">

      <mat-label>
        {{ 'PARENTS.FILTER.STATUS' | translate }}
      </mat-label>

      <mat-select
        [value]="isActive()"
        (selectionChange)="isActive.set($event.value)"
      >

        <!-- Show all parents -->
        <mat-option [value]="null">
          {{ 'PARENTS.FILTER.ALL' | translate }}
        </mat-option>

        <!-- Show active parents -->
        <mat-option [value]="true">
          {{ 'PARENTS.ACTIVE' | translate }}
        </mat-option>

        <!-- Show inactive parents -->
        <mat-option [value]="false">
          {{ 'PARENTS.INACTIVE' | translate }}
        </mat-option>

      </mat-select>

    </mat-form-field>

  </div>

</mat-dialog-content>

<!-- Dialog actions -->
<mat-dialog-actions align="end">

  <!-- Reset filter values -->
  <button
    mat-button
    type="button"
    (click)="clear()"
  >
    {{ 'PARENTS.FILTER.CLEAR' | translate }}
  </button>

  <!-- Close dialog without applying changes -->
  <button
    mat-button
    type="button"
    mat-dialog-close
  >
    {{ 'PARENTS.FILTER.CANCEL' | translate }}
  </button>

  <!-- Apply selected filter -->
  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="apply()"
  >
    {{ 'PARENTS.FILTER.APPLY' | translate }}
  </button>

</mat-dialog-actions>
