<app-page-header
  [title]="'PARENTS.HEADER.TITLE' | translate"
  [subtitle]="'PARENTS.HEADER.SUBTITLE' | translate"
>

  <!-- Add parent (Admin only) -->
  @if (canManage()) {
    <button
      actions
      mat-flat-button
      color="primary"
      type="button"
      (click)="addParent.emit()"
    >
      <mat-icon>person_add</mat-icon>

      {{ 'PARENTS.HEADER.ADD' | translate }}
    </button>
  }

</app-page-header>
