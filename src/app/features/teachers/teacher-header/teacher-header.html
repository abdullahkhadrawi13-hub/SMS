<app-page-header
  [title]="'TEACHERS.HEADER.TITLE' | translate"
  [subtitle]="'TEACHERS.HEADER.SUBTITLE' | translate"
>

  <!-- Add teacher (Admin only) -->
  @if (canManage()) {
    <button
      actions
      mat-flat-button
      color="primary"
      type="button"
      (click)="addTeacher.emit()"
    >
      <mat-icon>person_add</mat-icon>

      {{ 'TEACHERS.HEADER.ADD' | translate }}
    </button>
  }

</app-page-header>
