<div class="teachers-page">

  <!-- Page Header -->
  <app-teacher-header
    [canManage]="canManage()"
    (addTeacher)="openAddTeacher()"
  ></app-teacher-header>

  <!-- Search and Filter -->
  <div class="filters-card">

    <div class="search-container">

      <!-- Teacher Search -->
      <app-teacher-search
        (searchChange)="search.set($event)"
        (searchSubmit)="onSearch($event)"
      ></app-teacher-search>

      <!-- Teacher Filter -->
      <button
        mat-stroked-button
        type="button"
        (click)="openFilter()"
      >
        <mat-icon>filter_list</mat-icon>
        {{ 'TEACHERS.FILTER_BUTTON' | translate }}
      </button>

    </div>

  </div>

  <!-- Teacher Table (error / loading / table / empty state / pagination) -->
  <app-teacher-table
    [teachers]="teachers()"
    [isLoading]="isLoading()"
    [errorMessage]="errorMessage()"
    [totalCount]="totalCount()"
    [pageNumber]="pageNumber()"
    [pageSize]="pageSize()"
    [canManage]="canManage()"
    (retry)="retry()"
    (pageChange)="onPageChange($event)"
    (viewTeacher)="openTeacherDetails($event)"
    (editTeacher)="openEditTeacher($event)"
    (toggleStatus)="toggleTeacherStatus($event)"
  ></app-teacher-table>

</div>
