<!-- Dialog title -->
<h2 mat-dialog-title>
  {{ 'TEACHERS.FILTER.TITLE' | translate }}
</h2>

<!-- Filter content -->
<mat-dialog-content>

  <div class="filter-form">

    <!-- Teacher status filter -->
    <mat-form-field appearance="outline">

      <mat-label>
        {{ 'TEACHERS.FILTER.STATUS' | translate }}
      </mat-label>

      <mat-select
        [value]="isActive()"
        (selectionChange)="isActive.set($event.value)"
      >

        <!-- Show all teachers -->
        <mat-option [value]="null">
          {{ 'TEACHERS.FILTER.ALL' | translate }}
        </mat-option>

        <!-- Show active teachers -->
        <mat-option [value]="true">
          {{ 'TEACHERS.ACTIVE' | translate }}
        </mat-option>

        <!-- Show inactive teachers -->
        <mat-option [value]="false">
          {{ 'TEACHERS.INACTIVE' | translate }}
        </mat-option>

      </mat-select>

    </mat-form-field>

  </div>

</mat-dialog-content>

<!-- Dialog actions -->
<mat-dialog-actions align="end">

  <!-- Reset filter values -->
  <button
    mat-button
    type="button"
    (click)="clear()"
  >
    {{ 'TEACHERS.FILTER.CLEAR' | translate }}
  </button>

  <!-- Close dialog without applying changes -->
  <button
    mat-button
    type="button"
    mat-dialog-close
  >
    {{ 'TEACHERS.FILTER.CANCEL' | translate }}
  </button>

  <!-- Apply selected filter -->
  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="apply()"
  >
    {{ 'TEACHERS.FILTER.APPLY' | translate }}
  </button>

</mat-dialog-actions>
