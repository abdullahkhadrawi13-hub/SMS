<div class="academic-years-page">

  <!-- Page Header (with the back link to Settings) -->
  <app-page-header
    [title]="'ACADEMIC_YEARS.HEADER.TITLE' | translate"
    [subtitle]="(canManage()
      ? 'ACADEMIC_YEARS.HEADER.SUBTITLE'
      : 'ACADEMIC_YEARS.HEADER.SUBTITLE_READ_ONLY') | translate"
    backLink="/settings"
    [backLabel]="'ACADEMIC_YEARS.HEADER.BACK' | translate"
  >

    <!-- Add year (Admin only) -->
    @if (canManage()) {
      <button
        actions
        mat-flat-button
        type="button"
        (click)="openAddYear()"
      >
        <mat-icon>add</mat-icon>

        {{ 'ACADEMIC_YEARS.HEADER.ADD_YEAR' | translate }}
      </button>
    }

  </app-page-header>


  <!-- Error -->
  @if (errorMessage()) {

    <app-state-card
      type="error"
      [message]="errorMessage() | translate"
      (retry)="retry()"
    />

  }

  <!-- First load only -->
  @else if (isInitialLoading()) {

    <app-state-card
      type="loading"
      [message]="'ACADEMIC_YEARS.STATE.LOADING' | translate"
    />

  }

  <!-- Content -->
  @else {

    <div class="page-content" [class.is-refreshing]="isRefreshing()">

      <!-- Reload indicator: takes no height, so nothing jumps -->
      @if (isRefreshing()) {
        <mat-progress-bar
          class="refresh-bar"
          mode="indeterminate"
        ></mat-progress-bar>
      }

      <!-- The current term of the school -->
      <app-current-term-banner
        [term]="currentTerm()"
        [year]="currentYear()"
        [canManage]="canManage()"
      />

      @if (years().length > 0) {

        <!-- One card per year, newest first -->
        <div class="years-list">

          @for (view of years(); track view.year.academicYearId) {

            <app-year-card
              [view]="view"
              [expanded]="isExpanded(view.year.academicYearId)"
              [canManage]="canManage()"
              [busyTermId]="busyTermId()"
              (toggle)="toggleYear(view.year.academicYearId)"
              (editYear)="openEditYear(view.year)"
              (addTerm)="openAddTerm(view)"
              (editTerm)="openEditTerm(view, $event)"
              (toggleTermStatus)="toggleTermStatus($event)"
              (setCurrentTerm)="confirmSetCurrent(view, $event)"
              (closeGrades)="confirmGradesStatus(view, $event, 'close')"
              (openGrades)="confirmGradesStatus(view, $event, 'open')"
            />

          }

        </div>

      } @else {

        <!-- No years yet -->
        <app-state-card
          type="empty"
          icon="calendar_month"
          [message]="'ACADEMIC_YEARS.STATE.EMPTY' | translate"
        >
          @if (canManage()) {
            <button
              actions
              mat-stroked-button
              type="button"
              (click)="openAddYear()"
            >
              <mat-icon>add</mat-icon>

              {{ 'ACADEMIC_YEARS.HEADER.ADD_YEAR' | translate }}
            </button>
          }
        </app-state-card>

      }

    </div>

  }

</div>
