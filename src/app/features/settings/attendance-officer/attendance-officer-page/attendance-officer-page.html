<div class="attendance-officer-page">

  <!-- Page Header (with the back link to Settings) -->
  <app-page-header
    [title]="'ATTENDANCE_OFFICER.HEADER.TITLE' | translate"
    [subtitle]="'ATTENDANCE_OFFICER.HEADER.SUBTITLE' | translate"
    backLink="/settings"
    [backLabel]="'ATTENDANCE_OFFICER.HEADER.BACK' | translate"
  />


  <!-- Error -->
  @if (errorMessage()) {

    <app-state-card
      type="error"
      [message]="errorMessage() | translate"
      (retry)="retry()"
    />

  }

  <!-- Loading -->
  @else if (isLoading()) {

    <app-state-card
      type="loading"
      [message]="'ATTENDANCE_OFFICER.STATE.LOADING' | translate"
    />

  }

  <!-- Page Content -->
  @else {

    <div class="page-content">

      <!-- Current Officer -->
      <app-officer-current-card
        [officer]="officer()"
      ></app-officer-current-card>

      <!-- Choose a new officer: title, search, number of results, list -->
      <section
        class="teachers-section"
        aria-labelledby="teachers-section-title"
      >

        <div class="teachers-header">

          <h2 id="teachers-section-title" class="section-title">
            {{ 'ATTENDANCE_OFFICER.LIST.TITLE' | translate }}
          </h2>

          <p class="section-subtitle">
            {{ 'ATTENDANCE_OFFICER.LIST.SUBTITLE' | translate }}
          </p>

        </div>

        <!-- The shared list layout (styles.css → List page):
             the search on the page, the list card 16px under it. -->
        <div class="list-area">

          <div>

            <!-- The search is done by the backend, 400ms after typing stops. -->
            <app-search-field
              [(search)]="searchText"
              [label]="'ATTENDANCE_OFFICER.LIST.SEARCH_LABEL' | translate"
              [placeholder]="'ATTENDANCE_OFFICER.LIST.SEARCH_PLACEHOLDER' | translate"
              [clearLabel]="'ATTENDANCE_OFFICER.LIST.SEARCH_CLEAR' | translate"
              (searchTyping)="onSearchTyping()"
              (searchSubmit)="onSearch()"
              (searchClear)="clearSearch()"
            />

            <!-- Always in the page, so a screen reader reads each new number. -->
            <div role="status" aria-live="polite">
              @if (matchingKey(); as key) {
                <p class="list-results">
                  {{ key | translate: { count: totalCount() } }}
                </p>
              }
            </div>

          </div>

          <!-- Teacher List
               (hint / error / loading / rows / no results / pagination) -->
          <app-officer-teacher-list
            [teachers]="teachers()"
            [isLoading]="isListLoading()"
            [errorMessage]="listErrorMessage()"
            [totalCount]="totalCount()"
            [pageNumber]="pageNumber()"
            [pageSize]="pageSize"
            [hasSearched]="search() !== ''"
            [officerId]="officerId()"
            [selectedId]="selectedId()"
            [disabled]="isSaving()"
            (pageChange)="onPageChange($event)"
            (retry)="loadTeachers()"
            (selectTeacher)="onSelectTeacher($event)"
          ></app-officer-teacher-list>

        </div>

      </section>

      <!-- Save Bar (shared): shown only after a teacher is selected. -->
      @if (selectedTeacher()) {

        <app-save-bar
          [title]="('ATTENDANCE_OFFICER.SAVE_BAR.SELECTED' | translate) + ': ' + selectedName()"
          [hint]="'ATTENDANCE_OFFICER.SAVE_BAR.HINT' | translate"
          [undoLabel]="'ATTENDANCE_OFFICER.SAVE_BAR.CANCEL' | translate"
          [saveLabel]="'ATTENDANCE_OFFICER.SAVE_BAR.SAVE' | translate"
          [savingLabel]="'ATTENDANCE_OFFICER.SAVE_BAR.SAVING' | translate"
          saveIcon="how_to_reg"
          [saving]="isSaving()"
          (undo)="cancelSelection()"
          (save)="save()"
        ></app-save-bar>

      }

    </div>

  }

</div>
