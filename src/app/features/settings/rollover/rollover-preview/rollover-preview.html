<div class="preview">

  <!-- Filters: on the page background, like the list pages -->
  <div
    class="filters"
    role="group"
    [attr.aria-label]="'ROLLOVER.PREVIEW.FILTER_LABEL' | translate"
  >

    <button
      type="button"
      class="filter"
      [class.is-active]="filter() === null"
      [attr.aria-pressed]="filter() === null"
      (click)="select(null)"
    >
      @if (filter() === null) {
        <mat-icon aria-hidden="true">check</mat-icon>
      }

      {{ 'ROLLOVER.PREVIEW.ALL' | translate }}
      <span class="filter-count">{{ total() }}</span>
    </button>

    @for (chip of chips(); track chip.suggestion) {

      @let style = suggestionStyle[chip.suggestion];

      <button
        type="button"
        class="filter"
        [class.is-active]="filter() === chip.suggestion"
        [attr.aria-pressed]="filter() === chip.suggestion"
        [disabled]="chip.count === 0"
        (click)="select(chip.suggestion)"
      >
        @if (filter() === chip.suggestion) {
          <mat-icon aria-hidden="true">check</mat-icon>
        } @else {
          <span
            class="tone-dot"
            aria-hidden="true"
            [attr.data-tone]="style.tone"
            [attr.data-outlined]="style.outlined ? '' : null"
          ></span>
        }

        {{ style.labelKey | translate }}
        <span class="filter-count">{{ chip.count }}</span>
      </button>

    }

  </div>


  <!-- One card per class -->
  @if (groups().length > 0) {

    <div class="groups">

      @for (group of groups(); track group.classId) {

        <app-rollover-class-group
          [group]="group"
          [decisions]="decisions()"
          [isNewYear]="preview().isNewYear"
          [filter]="filter()"
          [isPhone]="isPhone()"
          (decisionChange)="decisionChange.emit($event)"
        ></app-rollover-class-group>

      }

    </div>

  } @else {

    <!-- No active students in the source term -->
    <app-state-card
      type="empty"
      icon="groups"
      [message]="'ROLLOVER.PREVIEW.EMPTY' | translate"
    />

  }

</div>
