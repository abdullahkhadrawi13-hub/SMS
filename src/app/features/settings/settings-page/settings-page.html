<div class="settings-page">

  <!-- Page Header -->
  <app-page-header
    [title]="'SETTINGS.HEADER.TITLE' | translate"
    [subtitle]="'SETTINGS.HEADER.SUBTITLE' | translate"
  />

  <!-- Settings Options: one card, one row per option -->
  <nav
    class="settings-card"
    [attr.aria-label]="'SETTINGS.HEADER.TITLE' | translate"
  >

    <ul class="settings-list">

      @for (option of options(); track option.route) {

        <li>

          <!-- The whole row is one link to its sub-route. -->
          <a class="settings-option" [routerLink]="option.route">

            <!-- Icon (one quiet colour for every option) -->
            <span class="option-icon" aria-hidden="true">
              <mat-icon>{{ option.icon }}</mat-icon>
            </span>

            <!-- Title + Description -->
            <span class="option-text">
              <span class="option-title">
                {{ option.title | translate }}
              </span>

              <span class="option-description">
                {{ option.description | translate }}
              </span>
            </span>

            <!-- "View only" (the AssistantPrincipal on the academic years) -->
            @if (option.readOnly?.()) {
              <span class="option-badge">
                {{ 'SETTINGS.OPTIONS.READ_ONLY' | translate }}
              </span>
            }

            <!-- Arrow: .flip turns it in Arabic -->
            <mat-icon class="option-arrow flip" aria-hidden="true">chevron_right</mat-icon>

          </a>

        </li>

      }

    </ul>

  </nav>

</div>
