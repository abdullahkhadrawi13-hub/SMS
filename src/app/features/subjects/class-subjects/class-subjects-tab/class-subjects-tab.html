<!-- Term / Class (shared with the plans tab) / Section -->
<app-class-subjects-selector
  [terms]="selection.terms()"
  [termsLoading]="selection.isLoading()"
  [termId]="selection.termId()"
  [classes]="selection.classes()"
  [classId]="selection.classId()"
  [sections]="sections()"
  [sectionsLoading]="sectionsLoading()"
  [sectionId]="sectionId()"
  (termChange)="onTermChange($event)"
  (classChange)="onClassChange($event)"
  (sectionChange)="onSectionChange($event)"
></app-class-subjects-selector>

<!-- Subjects of the section (error / loading / select / empty / table) -->
<app-class-subjects-table
  [rows]="rows()"
  [counts]="counts()"
  [missingSubjects]="missingSubjects()"
  [hasSelection]="hasSelection()"
  [isLoading]="assignmentsLoading()"
  [errorMessage]="selection.errorMessage() || errorMessage()"
  [className]="selection.selectedClassName()"
  [sectionName]="selectedSectionName()"
  [termLabel]="selection.selectedTermLabel()"
  [canManage]="canManage()"
  [openingForm]="openingForm()"
  (retry)="retry()"
  (addSubject)="openAddAssignment($event)"
  (editSubject)="openEditAssignment($event)"
  (viewPlan)="viewPlan($event)"
  (toggleStatus)="toggleAssignmentStatus($event)"
></app-class-subjects-table>
