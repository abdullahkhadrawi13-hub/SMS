<div class="page-header">

  <div class="title-section">

    <h1>
      {{ titleKey() | translate }}
    </h1>

    <p>
      {{ subtitleKey() | translate }}
    </p>

  </div>

  <!-- Add subject (Admin only, subjects list tab) -->
  @if (showAdd()) {
    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="addSubject.emit()"
    >
      <mat-icon>menu_book</mat-icon>

      {{ 'SUBJECTS.HEADER.ADD' | translate }}
    </button>
  }

</div>
