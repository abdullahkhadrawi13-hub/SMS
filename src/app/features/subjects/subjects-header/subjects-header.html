<app-page-header
  [title]="titleKey() | translate"
  [subtitle]="subtitleKey() | translate"
>

  <!-- Add subject (Admin only, subjects list tab) -->
  @if (showAdd()) {
    <button
      actions
      mat-flat-button
      color="primary"
      type="button"
      (click)="addSubject.emit()"
    >
      <mat-icon>menu_book</mat-icon>

      {{ 'SUBJECTS.HEADER.ADD' | translate }}
    </button>
  }

  <!-- Copy plans + new plan (Admin only, subject plans tab) -->
  @if (showPlanActions()) {
    <ng-container actions>
      <button
        mat-stroked-button
        type="button"
        (click)="copyPlans.emit()"
      >
        <mat-icon>content_copy</mat-icon>

        {{ 'SUBJECTS.HEADER.COPY_PLANS' | translate }}
      </button>

      <button
        mat-flat-button
        color="primary"
        type="button"
        (click)="addPlan.emit()"
      >
        <mat-icon>add</mat-icon>

        {{ 'SUBJECTS.HEADER.ADD_PLAN' | translate }}
      </button>
    </ng-container>
  }

</app-page-header>
