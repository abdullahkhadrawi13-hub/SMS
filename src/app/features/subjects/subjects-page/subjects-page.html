<div class="subjects-page">

  @if (ownSubjectsOnly()) {

    <!-- Teacher: My subjects -->
    <app-subjects-header
      titleKey="SUBJECTS.MY_SUBJECTS.TITLE"
      subtitleKey="SUBJECTS.MY_SUBJECTS.SUBTITLE"
    ></app-subjects-header>

    <app-my-subjects></app-my-subjects>

  } @else {

    <!-- Page Header -->
    <app-subjects-header
      [showAdd]="canManage() && activeTab() === 'catalog'"
      (addSubject)="openAddSubject()"
    ></app-subjects-header>

    <!-- Tabs -->
    <nav
      mat-tab-nav-bar
      mat-stretch-tabs="false"
      class="subjects-tabs"
      [tabPanel]="tabPanel"
    >

      <a
        mat-tab-link
        [active]="activeTab() === 'class'"
        (click)="selectTab('class')"
      >
        <span class="tab-label">
          <mat-icon>assignment_ind</mat-icon>

          <span>
            {{ 'SUBJECTS.TABS.CLASS' | translate }}
          </span>
        </span>
      </a>

      <a
        mat-tab-link
        [active]="activeTab() === 'catalog'"
        (click)="selectTab('catalog')"
      >
        <span class="tab-label">
          <mat-icon>menu_book</mat-icon>

          <span>
            {{ 'SUBJECTS.TABS.CATALOG' | translate }}
          </span>
        </span>
      </a>

    </nav>

    <mat-tab-nav-panel #tabPanel>

      <!-- Subjects of a section (class / section / term) -->
      <div [hidden]="activeTab() !== 'class'">
        <app-class-subjects
          [canManage]="canManage()"
        ></app-class-subjects>
      </div>

      <!-- General subjects list -->
      <div [hidden]="activeTab() !== 'catalog'">
        <app-subjects-catalog
          [canManage]="canManage()"
        ></app-subjects-catalog>
      </div>

    </mat-tab-nav-panel>

  }

</div>
