<div class="subjects-page">

  <!-- Page Header (the buttons change with the open tab) -->
  <app-subjects-header
    [subtitleKey]="subtitleKey()"
    [showAdd]="canManage() && activeTab() === 'catalog'"
    [showPlanActions]="canManage() && activeTab() === 'plans'"
    (addSubject)="openAddSubject()"
    (addPlan)="openAddPlan()"
    (copyPlans)="openCopyPlans()"
  ></app-subjects-header>

  <!-- Tabs -->
  <nav
    mat-tab-nav-bar
    mat-stretch-tabs="false"
    class="subjects-tabs"
    [tabPanel]="tabPanel"
  >

    <a
      mat-tab-link
      [active]="activeTab() === 'plans'"
      (click)="selectTab('plans')"
    >
      <span class="tab-label">
        <mat-icon>rule</mat-icon>

        <span>
          {{ 'SUBJECTS.TABS.PLANS' | translate }}
        </span>
      </span>
    </a>

    <a
      mat-tab-link
      [active]="activeTab() === 'assignments'"
      (click)="selectTab('assignments')"
    >
      <span class="tab-label">
        <mat-icon>assignment_ind</mat-icon>

        <span>
          {{ 'SUBJECTS.TABS.ASSIGNMENTS' | translate }}
        </span>
      </span>
    </a>

    <a
      mat-tab-link
      [active]="activeTab() === 'catalog'"
      (click)="selectTab('catalog')"
    >
      <span class="tab-label">
        <mat-icon>menu_book</mat-icon>

        <span>
          {{ 'SUBJECTS.TABS.CATALOG' | translate }}
        </span>
      </span>
    </a>

  </nav>

  <mat-tab-nav-panel #tabPanel>

    <!-- Subject plans of a class (term / class) -->
    <div [hidden]="activeTab() !== 'plans'">
      <app-plans-tab
        [canManage]="canManage()"
        [active]="activeTab() === 'plans'"
        (assignTeacher)="selectTab('assignments')"
      ></app-plans-tab>
    </div>

    <!-- Subjects of a section and their teachers (class / section / term) -->
    <div [hidden]="activeTab() !== 'assignments'">
      <app-subject-assignments-tab
        [canManage]="canManage()"
        [active]="activeTab() === 'assignments'"
        (createPlan)="createPlanFromAssignments($event)"
      ></app-subject-assignments-tab>
    </div>

    <!-- General subjects list -->
    <div [hidden]="activeTab() !== 'catalog'">
      <app-subjects-list-tab
        [canManage]="canManage()"
      ></app-subjects-list-tab>
    </div>

  </mat-tab-nav-panel>

</div>
