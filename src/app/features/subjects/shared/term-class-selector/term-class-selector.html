<!-- Term / Class / Section: fields on the page background, above the content
     (the shared field look of styles.css, like the attendance record tab). -->
<div class="selector-fields" [class.two-fields]="!showSection()">

  <!-- Academic term (the current term is selected by default) -->
  <div class="field">

    <label class="field-label" for="subjects-term">
      {{ 'SUBJECTS.TERM_CLASS_SELECTOR.TERM' | translate }}
    </label>

    <div class="field-box is-select">

      <select
        id="subjects-term"
        [disabled]="termsLoading()"
        (change)="onTermSelect($any($event.target).value)"
      >

        @for (term of terms(); track term.academicTermId) {
          <option
            [value]="term.academicTermId"
            [selected]="termId() === term.academicTermId"
          >
            {{ getTermLabel(term) }}
            @if (term.isCurrent) {
              {{ 'SUBJECTS.TERM_CLASS_SELECTOR.CURRENT' | translate }}
            }
          </option>
        }

      </select>

      @if (termsLoading()) {
        <mat-spinner class="field-spinner" diameter="16" aria-hidden="true" />
      } @else {
        <mat-icon class="field-chevron" aria-hidden="true">expand_more</mat-icon>
      }

    </div>

  </div>


  <!-- Class (Active only) -->
  <div class="field">

    <label class="field-label" for="subjects-class">
      {{ 'SUBJECTS.TERM_CLASS_SELECTOR.CLASS' | translate }}
    </label>

    <div class="field-box is-select">

      <select
        id="subjects-class"
        [disabled]="termsLoading()"
        (change)="onClassSelect($any($event.target).value)"
      >

        <option value="" disabled [selected]="classId() === null">
          {{ 'SUBJECTS.TERM_CLASS_SELECTOR.CLASS_PLACEHOLDER' | translate }}
        </option>

        @for (c of classes(); track c.schoolClassId) {
          <option
            [value]="c.schoolClassId"
            [selected]="classId() === c.schoolClassId"
          >
            {{ getClassName(c) }}
          </option>
        }

      </select>

      <mat-icon class="field-chevron" aria-hidden="true">expand_more</mat-icon>

    </div>

  </div>


  <!-- Section (disabled until a class is chosen; its text says why) -->
  @if (showSection()) {

    <div class="field">

      <label class="field-label" for="subjects-section">
        {{ 'SUBJECTS.TERM_CLASS_SELECTOR.SECTION' | translate }}
      </label>

      <div class="field-box is-select">

        <select
          id="subjects-section"
          [disabled]="classId() === null || sectionsLoading()"
          (change)="onSectionSelect($any($event.target).value)"
        >

          <option value="" disabled [selected]="sectionId() === null">
            {{
              (classId() === null
                ? 'SUBJECTS.TERM_CLASS_SELECTOR.SECTION_NEEDS_CLASS'
                : 'SUBJECTS.TERM_CLASS_SELECTOR.SECTION_PLACEHOLDER'
              ) | translate
            }}
          </option>

          @for (s of sections(); track s.sectionId) {
            <option
              [value]="s.sectionId"
              [selected]="sectionId() === s.sectionId"
            >
              {{ getSectionName(s) }}
            </option>
          }

        </select>

        @if (sectionsLoading()) {
          <mat-spinner class="field-spinner" diameter="16" aria-hidden="true" />
        } @else {
          <mat-icon class="field-chevron" aria-hidden="true">expand_more</mat-icon>
        }

      </div>

    </div>

  }

</div>
