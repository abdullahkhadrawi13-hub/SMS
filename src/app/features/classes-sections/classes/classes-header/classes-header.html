<app-page-header
  [title]="'CLASSES.HEADER.TITLE' | translate"
  [subtitle]="'CLASSES.HEADER.SUBTITLE' | translate"
>

  <!-- The page's primary button (Admin only) -->
  @if (canManage()) {
    <button actions mat-flat-button type="button" (click)="addClass.emit()">
      <mat-icon>add</mat-icon>
      {{ 'CLASSES.HEADER.ADD_CLASS' | translate }}
    </button>
  }

</app-page-header>
