<app-page-header
  [title]="'CLASSES.HEADER.TITLE' | translate"
  [subtitle]="'CLASSES.HEADER.SUBTITLE' | translate"
>

  <!-- The cards' student counts are for this term -->
  @if (termLabel()) {
    <span actions class="term-note">
      <mat-icon>event</mat-icon>
      {{ 'CLASSES.HEADER.COUNTS_TERM' | translate: { term: termLabel() } }}
    </span>
  }

</app-page-header>
