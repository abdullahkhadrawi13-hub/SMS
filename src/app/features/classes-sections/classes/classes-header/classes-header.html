<div class="page-header">

  <div class="title-section">

    <h1>
      {{ 'CLASSES.HEADER.TITLE' | translate }}
    </h1>

    <p>
      {{ 'CLASSES.HEADER.SUBTITLE' | translate }}
    </p>

  </div>

  <!-- The cards' student counts are for this term -->

    <span class="term-note">
      <mat-icon>event</mat-icon>
      {{ 'CLASSES.HEADER.COUNTS_TERM' | translate: { term: termLabel() } }}
    </span>
  }

</div>
