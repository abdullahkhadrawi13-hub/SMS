<!-- Error -->
@if (errorMessage()) {

  <app-state-card
    type="error"
    [message]="errorMessage() | translate"
    (retry)="retry.emit()"
  />

}


<!-- First load only (nothing to show yet) -->
@else if (isInitialLoading()) {

  <app-state-card
    type="loading"
    [message]="'CLASSES.GRID.LOADING' | translate"
  />

}


<!-- No classes, and the user cannot add one (Assistant Principal) -->
@else if (classes().length === 0 && !canManage()) {

  <app-state-card
    type="empty"
    icon="class"
    [message]="'CLASSES.GRID.EMPTY' | translate"
  />

}


<!-- Classes grid -->
@else {

  <div class="grid-wrapper" [class.is-refreshing]="isRefreshing()">

    <!-- Reload indicator: sits on top without taking any height -->
    @if (isRefreshing()) {
      <mat-progress-bar
        class="refresh-bar"
        mode="indeterminate"
      ></mat-progress-bar>
    }

    <div class="classes-grid">

      <!-- One card per class (its color comes from its position); a click opens the class -->
      @for (schoolClass of classes(); track schoolClass.schoolClassId; let i = $index) {
        <app-class-card
          [schoolClass]="schoolClass"
          [sections]="sectionsLoaded() ? (sectionsByClass().get(schoolClass.schoolClassId) ?? []) : null"
          [colorIndex]="i"
          [canManage]="canManage()"
          [isToggling]="togglingClassId() !== null"
          (edit)="editClass.emit(schoolClass)"
          (toggleStatus)="toggleStatus.emit(schoolClass)"
        />
      }

      <!-- Add academic class (Admin only) -->
      @if (canManage()) {
        <button
          type="button"
          class="add-card"
          (click)="addClass.emit()"
        >

          <span class="add-icon">
            <mat-icon>add</mat-icon>
          </span>

          <h3>
            {{ 'CLASSES.GRID.ADD_TITLE' | translate }}
          </h3>

          <p>
            {{ 'CLASSES.GRID.ADD_HINT' | translate }}
          </p>

        </button>
      }

    </div>

  </div>

}
