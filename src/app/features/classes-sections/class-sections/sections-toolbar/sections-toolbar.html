<!-- Term: the term of the student counts ("الفصل الدراسي الأول · 2026/2027 (الحالي)") -->
<select
  class="filter-select is-wide"
  [class.is-active]="isOtherTerm()"
  [attr.aria-label]="'CLASS_SECTIONS.TOOLBAR.TERM' | translate"
  [disabled]="terms().length === 0"
  (change)="onTermChange($any($event.target).value)"
>
  @for (term of terms(); track term.academicTermId) {
    <option [value]="term.academicTermId" [selected]="term.academicTermId === selectedTermId()">
      {{ termLabel(term) }}
      @if (term.isCurrent) {
        ({{ 'CLASS_SECTIONS.TOOLBAR.CURRENT' | translate }})
      }
    </option>
  }
</select>

<!-- Status: all / active / inactive -->
<select
  class="filter-select"
  [class.is-active]="statusFilter() !== 'all'"
  [attr.aria-label]="'CLASS_SECTIONS.TOOLBAR.STATUS' | translate"
  (change)="onStatusChange($any($event.target).value)"
>
  @for (option of statusOptions; track option.value) {
    <option [value]="option.value" [selected]="option.value === statusFilter()">
      {{ 'CLASS_SECTIONS.TOOLBAR.STATUS_OPTION' | translate: { name: (option.label | translate) } }}
    </option>
  }
</select>
