<div class="class-sections-page">

  <!-- First load -->
  @if (isLoadingPage()) {
    <app-state-card
      type="loading"
      [message]="'CLASS_SECTIONS.LOADING' | translate"
    />
  }

  <!-- The class could not be loaded, or does not exist -->
  @else if (pageError()) {
    <app-state-card
      type="error"
      [message]="pageError() | translate"
      [showRetry]="pageError() !== 'CLASS_SECTIONS.ERROR.NOT_FOUND'"
      (retry)="loadPage()"
    >
      <a actions mat-stroked-button routerLink="/classes-sections">
        {{ 'CLASS_SECTIONS.BACK' | translate }}
      </a>
    </app-state-card>
  }

  <!-- The class and its sections -->
  @else if (schoolClass(); as currentClass) {

    <app-class-header
      [schoolClass]="currentClass"
      [sections]="sections()"
      [sectionsLoaded]="!isLoadingSections() && !sectionsError()"
      [canManage]="canManageClass()"
      [canAddSection]="canAddSection()"
      [isToggling]="isTogglingClass()"
      (editClass)="openEditClass()"
      (toggleStatus)="toggleClassStatus()"
      (addSection)="openAddSection()"
    />

    <div class="list-area">

      <app-sections-toolbar
        [terms]="terms()"
        [selectedTermId]="selectedTermId()"
        [statusFilter]="statusFilter()"
        (termChange)="onTermChange($event)"
        (statusChange)="onStatusChange($event)"
      />

      <app-sections-list
        [sections]="visibleSections()"
        [totalCount]="sections().length"
        [statusFilter]="statusFilter()"
        [maxStudentCount]="maxStudentCount()"
        [schoolClass]="currentClass"
        [isLoading]="isLoadingSections()"
        [errorMessage]="sectionsError()"
        [canManage]="canManageSections()"
        [canAdd]="canAddSection()"
        [togglingSectionId]="togglingSectionId()"
        (retry)="loadSections()"
        (editSection)="openEditSection($event)"
        (toggleStatus)="toggleSectionStatus($event)"
        (showAll)="onStatusChange('all')"
      />

    </div>

  }

</div>
