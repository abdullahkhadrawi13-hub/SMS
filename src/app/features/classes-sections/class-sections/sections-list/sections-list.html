<!-- Error -->
@if (errorMessage()) {

  <app-state-card
    type="error"
    [message]="errorMessage() | translate"
    (retry)="retry.emit()"
  />

}


<!-- First load -->
@else if (isInitialLoading()) {

  <app-state-card
    type="loading"
    [message]="'CLASS_SECTIONS.LIST.LOADING' | translate"
  />

}


<!-- Sections exist, but none match the status filter -->
@else if (isFilteredEmpty()) {

  <app-state-card
    type="empty"
    icon="filter_alt_off"
    [message]="'CLASS_SECTIONS.LIST.NO_MATCH' | translate"
  >
    <button actions mat-button type="button" (click)="showAll.emit()">
      {{ 'CLASS_SECTIONS.LIST.SHOW_ALL' | translate }}
    </button>
  </app-state-card>

}


<!-- No sections, and the user cannot add one -->
@else if (sections().length === 0 && !showAddRow()) {

  <app-state-card
    type="empty"
    icon="groups"
    [message]="'CLASS_SECTIONS.LIST.EMPTY' | translate"
  />

}


<!-- The rows -->
@else {

  <div class="list-wrapper" [class.is-refreshing]="isRefreshing()">

    <!-- Reload indicator: sits on top without taking any height -->
    @if (isRefreshing()) {
      <mat-progress-bar class="refresh-bar" mode="indeterminate"></mat-progress-bar>
    }

    <div class="rows">

      @for (section of sections(); track section.sectionId) {
        <app-section-row
          [section]="section"
          [color]="color()"
          [maxStudentCount]="maxStudentCount()"
          [canManage]="canManage()"
          [isToggling]="togglingSectionId() !== null"
          (edit)="editSection.emit(section)"
          (toggleStatus)="toggleStatus.emit(section)"
        />
      }

      <!-- Add section (Admin, active class) -->
      @if (showAddRow()) {
        <button type="button" class="add-row" (click)="addSection.emit()">

          <span class="add-icon">
            <mat-icon>add</mat-icon>
          </span>

          <span class="add-text">
            <strong>{{ 'CLASS_SECTIONS.LIST.ADD_TITLE' | translate }}</strong>
            <small>
              {{
                totalCount() === 0
                  ? ('CLASS_SECTIONS.LIST.ADD_HINT_FIRST' | translate)
                  : ('CLASS_SECTIONS.LIST.ADD_HINT' | translate: { className: className() })
              }}
            </small>
          </span>

        </button>
      }

    </div>

  </div>

}
