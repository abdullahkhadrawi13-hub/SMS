<div class="change-password-page">
  <div class="change-password-card">
    <!-- Header -->
    <div class="page-header">
      <img src="/images/sms-logo.jpg" alt="School Management System Logo" class="school-logo" />

      <h1>
        {{ 'CHANGE_PASSWORD.TITLE' | translate }}
      </h1>

      <p>
        {{ 'CHANGE_PASSWORD.SUBTITLE' | translate }}
      </p>
    </div>

    <!-- Change Password Form -->
    <form (ngSubmit)="onSubmit()">
      <!-- Current Password -->
      <div class="form-group">
        <label for="currentPassword">
          {{ 'CHANGE_PASSWORD.CURRENT_PASSWORD' | translate }}
        </label>

        <div class="password-input">
          <input
            id="currentPassword"
            name="currentPassword"
            [type]="passwordVisibility[0]() ? 'text' : 'password'"
            [(ngModel)]="currentPassword"
            [placeholder]="'CHANGE_PASSWORD.CURRENT_PASSWORD_PLACEHOLDER' | translate"
          />

          <button type="button" class="password-toggle" (click)="togglePassword(0)">
            <mat-icon>
              {{ passwordVisibility[0]() ? 'visibility' : 'visibility_off' }}
            </mat-icon>
          </button>
        </div>
      </div>

      <!-- New Password -->
      <div class="form-group">
        <label for="newPassword">
          {{ 'CHANGE_PASSWORD.NEW_PASSWORD' | translate }}
        </label>

        <div class="password-input">
          <input
            id="newPassword"
            name="newPassword"
            [type]="passwordVisibility[1]() ? 'text' : 'password'"
            [(ngModel)]="newPassword"
            [placeholder]="'CHANGE_PASSWORD.NEW_PASSWORD_PLACEHOLDER' | translate"
          />

          <button type="button" class="password-toggle" (click)="togglePassword(1)">
            <mat-icon>
              {{ passwordVisibility[1]() ? 'visibility' : 'visibility_off' }}
            </mat-icon>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">
          {{ 'CHANGE_PASSWORD.CONFIRM_PASSWORD' | translate }}
        </label>

        <div class="password-input">
          <input
            id="confirmPassword"
            name="confirmPassword"
            [type]="passwordVisibility[2]() ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            [placeholder]="'CHANGE_PASSWORD.CONFIRM_PASSWORD_PLACEHOLDER' | translate"
          />

          <button type="button" class="password-toggle" (click)="togglePassword(2)">
            <mat-icon>
              {{ passwordVisibility[2]() ? 'visibility' : 'visibility_off' }}
            </mat-icon>
          </button>
        </div>
      </div>
      @if (errorMessage()) {
        <p class="error-message">
          {{ errorMessage() | translate }}
        </p>
      }

      <!-- Change Password Button -->
      <button type="submit" class="change-password-button" [disabled]="isLoading()">
        {{
          isLoading()
            ? ('CHANGE_PASSWORD.LOADING' | translate)
            : ('CHANGE_PASSWORD.BUTTON' | translate)
        }}
      </button>
    </form>

    <!-- Language Switcher -->
    <div class="language-container">
      <app-language-switcher />
    </div>
  </div>
</div>
```
