<div class="grades-page">

  <!-- Page Header -->
  <app-page-header
    [title]="'GRADES.HEADER.TITLE' | translate"
    [subtitle]="subtitleKey() | translate"
  />


  <!-- Which sheet: teacher (class and subject) or staff (term → class → section → subject) -->
  <app-grades-selector
    [mode]="mode()"
    [terms]="terms()"
    [termsLoading]="termsLoading()"
    [termId]="termId()"
    [classes]="classes()"
    [classId]="classId()"
    [sections]="sections()"
    [sectionsLoading]="sectionsLoading()"
    [sectionId]="sectionId()"
    [assignments]="assignmentOptions()"
    [assignmentsLoading]="assignmentsLoading()"
    [assignmentId]="assignmentId()"
    [locked]="hasChanges()"
    (termChange)="onTermChange($event)"
    (classChange)="onClassChange($event)"
    (sectionChange)="onSectionChange($event)"
    (assignmentChange)="onAssignmentChange($event)"
  ></app-grades-selector>


  <!-- The sheet (loading / error / empty / table) -->
  <app-grades-sheet
    [sheet]="sheet()"
    [draft]="draft()"
    [editable]="editable()"
    [viewer]="viewer()"
    [termName]="sheetTermName()"
    [teacherName]="sheetTeacherName()"
    [loading]="sheetLoading()"
    [saving]="saving()"
    [errorMessage]="errorMessage()"
    [canRetry]="errorRetryable()"
    [emptyState]="emptyState()"
    (markChange)="onMarkChange($event)"
    (retry)="retry()"
  ></app-grades-sheet>


  <!-- Unsaved marks: Undo / Save sheet (shared save bar) -->
  @if (editable() && hasChanges()) {
    <app-save-bar
      [title]="'GRADES.SAVE_BAR.CHANGES' | translate: { count: draftStats().changes }"
      [hint]="'GRADES.SAVE_BAR.VISIBLE' | translate"
      [error]="draftStats().invalid > 0
        ? ('GRADES.SAVE_BAR.INVALID' | translate: { count: draftStats().invalid })
        : null"
      [undoLabel]="'GRADES.SAVE_BAR.RESET' | translate"
      [saveLabel]="'GRADES.SAVE_BAR.SAVE' | translate"
      [savingLabel]="'GRADES.SAVE_BAR.SAVING' | translate"
      [saving]="saving()"
      (undo)="resetChanges()"
      (save)="saveSheet()"
    ></app-save-bar>
  }

</div>
