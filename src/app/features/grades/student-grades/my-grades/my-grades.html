<div class="student-grades-page">

  <!-- Page Header: title, term / class and section -->
  <app-page-header
    [title]="'STUDENT_GRADES.MY_TITLE' | translate"
    [subtitle]="termLabel() ? ('STUDENT_GRADES.TERM_LABEL' | translate: termLabel()) : ''"
  >

    @if (classSection(); as classSection) {
      <span actions class="class-chip">
        <mat-icon>school</mat-icon>
        {{ 'STUDENT_GRADES.CLASS_SECTION' | translate: classSection }}
      </span>
    }

  </app-page-header>


  <!-- Loading -->
  @if (loading()) {
    <app-state-card
      type="loading"
      [message]="'STUDENT_GRADES.LOADING' | translate"
    />
  }

  <!-- Error -->
  @else if (errorMessage()) {
    <app-state-card
      type="error"
      [message]="errorMessage() | translate"
      (retry)="load()"
    />
  }

  <!-- No record in the current term -->
  @else if (term() === null) {
    <app-state-card
      type="empty"
      icon="event_busy"
      [message]="'STUDENT_GRADES.EMPTY.TERM' | translate"
    />
  }

  <!-- The current term (or the "not enrolled" message) -->
  @else if (term(); as term) {
    <app-term-grades [term]="term" viewer="portal" />
  }

</div>
