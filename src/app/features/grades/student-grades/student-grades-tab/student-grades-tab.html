<!-- Loading -->
@if (loading()) {
  <app-state-card
    type="loading"
    [message]="'STUDENT_GRADES.LOADING' | translate"
    size="compact"
  />
}

<!-- Error -->
@else if (errorMessage()) {
  <app-state-card
    type="error"
    [message]="errorMessage() | translate"
    size="compact"
    (retry)="load()"
  />
}

<!-- The student has no record in any term -->
@else if (!selectedTerm()) {
  <app-state-card
    type="empty"
    icon="menu_book"
    [message]="'STUDENT_GRADES.EMPTY.STAFF' | translate"
    size="compact"
  />
}

<!-- The selected term -->
@else {

  @if (selectedTerm(); as term) {

    <app-term-grades
      [term]="term"
      viewer="staff"
      [studentName]="studentName()"
    >

      <!-- More than one term: a field to choose -->
      @if (termOptions().length > 1) {

        <div termSelect class="term-field">
          <div class="field-box is-select">
            <select
              [attr.aria-label]="'STUDENT_GRADES.TERM' | translate"
              (change)="onTermChange($any($event.target).value)"
            >
              @for (option of termOptions(); track option.academicTermId) {
                <option
                  [value]="option.academicTermId"
                  [selected]="option.academicTermId === termId()"
                >
                  {{ 'STUDENT_GRADES.TERM_LABEL' | translate: option.label }}@if (option.areGradesClosed) { · {{ 'GRADES.SELECTOR.CLOSED' | translate }}}
                </option>
              }
            </select>

            <mat-icon class="field-chevron" aria-hidden="true">expand_more</mat-icon>
          </div>
        </div>

      } @else if (selectedOption(); as option) {

        <!-- One term only: its name, without a field -->
        <span termSelect class="term-name">
          <mat-icon aria-hidden="true">event</mat-icon>
          {{ 'STUDENT_GRADES.TERM_LABEL' | translate: option.label }}
        </span>

      }

    </app-term-grades>

  }

}
