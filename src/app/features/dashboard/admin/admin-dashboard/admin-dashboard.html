<app-page-header
  [title]="'DASHBOARD.TITLE' | translate"
  [subtitle]="'DASHBOARD.SUBTITLE' | translate"
>
  <!-- No action until the dashboard is connected to the backend -->
  <button actions mat-stroked-button type="button" class="add-student">
    <mat-icon>person_add</mat-icon>
    {{ 'DASHBOARD.ADD_STUDENT' | translate }}
  </button>

  <button actions mat-flat-button type="button">
    <mat-icon>fact_check</mat-icon>
    {{ 'DASHBOARD.RECORD_ATTENDANCE' | translate }}
  </button>
</app-page-header>


<!-- TEMPORARY: removed together with dashboard-sample-data.ts -->
<p class="sample-note" role="note">
  <mat-icon aria-hidden="true">info</mat-icon>
  <span>{{ 'DASHBOARD.SAMPLE_NOTE' | translate }}</span>
</p>


<div class="dashboard">

  <div class="dashboard-main">
    <app-today-attendance-card [data]="data.today" />
    <app-dashboard-stats [data]="data.stats" />
  </div>

  <div class="dashboard-side">
    <app-attention-card [data]="data.attention" [isAdmin]="true" />
    <app-current-term-card [data]="data.term" [isAdmin]="true" />
  </div>

</div>
