<ul class="lines">
  @for (line of lines(); track line.id) {
    <li class="line">
      <span class="line-what">
        <span class="line-subject">{{ line.subject }}</span>
        <span class="line-assessment">{{ line.assessment }}</span>
      </span>

      <span class="line-date">
        {{ line.date }}
        @if (line.isEdited) {
          <span class="edited">{{ 'DASHBOARD.MARKS.EDITED' | translate }}</span>
        }
      </span>

      <span class="line-mark tabular" [class.low]="line.isLow">
        {{ line.mark }} <small>/ {{ line.maxMark }}</small>
      </span>
    </li>
  }
</ul>
