<app-page-header
  [title]="'DASHBOARD.TITLE' | translate"
  [subtitle]="subtitle() ? (subtitle()!.key | translate: subtitle()!.params) : ''"
/>

@if (errorMessage()) {

  <app-state-card
    type="error"
    [message]="errorMessage()"
    [showRetry]="errorRetryable()"
    (retry)="load()"
  />

} @else if (isLoading() || !card()) {

  <app-state-card type="loading" [message]="'DASHBOARD.LOADING' | translate" />

} @else if (card(); as card) {

  <div class="dashboard">

    <div class="dashboard-main">
      @if (card.currentTerm) {
        <app-student-marks-card [marks]="card.latestMarks" />
        <app-dashboard-numbers [items]="numbers()" ariaKey="DASHBOARD.ATTENDANCE_NUMBERS.ARIA" />
      } @else {
        <app-state-card
          type="empty"
          icon="event_busy"
          [title]="'DASHBOARD.NO_TERM' | translate"
          [message]="'DASHBOARD.STUDENT.NO_TERM_MESSAGE' | translate"
        />
      }
    </div>

    <div class="dashboard-side">
      <app-student-info-card [info]="info()!" />
    </div>

  </div>

}
