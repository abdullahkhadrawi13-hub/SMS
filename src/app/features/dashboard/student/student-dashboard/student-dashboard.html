<app-page-header
  [title]="'DASHBOARD.TITLE' | translate"
  [subtitle]="'DASHBOARD.STUDENT.SUBTITLE' | translate"
/>


<!-- TEMPORARY: removed together with dashboard-sample-data.ts -->
<p class="sample-note" role="note">
  <mat-icon aria-hidden="true">info</mat-icon>
  <span>{{ 'DASHBOARD.SAMPLE_NOTE' | translate }}</span>
</p>


<div class="dashboard">

  <div class="dashboard-main">
    <app-student-grades-card [subjects]="data.subjects" />
    <app-dashboard-numbers [items]="numbers()" />
  </div>

  <div class="dashboard-side">
    <app-student-info-card [info]="data.info" />
    <app-current-term-card [data]="term" [showYearsLink]="false" />
  </div>

</div>
