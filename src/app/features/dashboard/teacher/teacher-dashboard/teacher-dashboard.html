<app-page-header
  [title]="'DASHBOARD.TITLE' | translate"
  [subtitle]="(isOfficer() ? 'DASHBOARD.TEACHER.SUBTITLE_OFFICER' : 'DASHBOARD.TEACHER.SUBTITLE') | translate"
>
  <!-- No action until the dashboard is connected to the backend.
       One primary button: attendance for the officer, grades for the others. -->
  @if (isOfficer()) {
    <button actions mat-stroked-button type="button" class="secondary-action">
      <mat-icon>edit_note</mat-icon>
      {{ 'DASHBOARD.TEACHER.ENTER_GRADES' | translate }}
    </button>
  }

  @if (isOfficer()) {
    <button actions mat-flat-button type="button">
      <mat-icon>fact_check</mat-icon>
      {{ 'DASHBOARD.RECORD_ATTENDANCE' | translate }}
    </button>
  } @else {
    <button actions mat-flat-button type="button">
      <mat-icon>edit_note</mat-icon>
      {{ 'DASHBOARD.TEACHER.ENTER_GRADES' | translate }}
    </button>
  }
</app-page-header>


<!-- TEMPORARY: removed together with dashboard-sample-data.ts -->
<p class="sample-note" role="note">
  <mat-icon aria-hidden="true">info</mat-icon>
  <span>{{ 'DASHBOARD.SAMPLE_NOTE' | translate }}</span>
</p>


<div class="dashboard">

  <div class="dashboard-main">
    @if (isOfficer()) {
      <app-today-attendance-card [data]="school.today" />
    }

    <app-teacher-grades-card [rows]="data.rows" />
    <app-dashboard-numbers [items]="numbers()" />
  </div>

  <div class="dashboard-side">
    <app-notices-card [notices]="notices()" />
    <app-current-term-card [data]="school.term" [showYearsLink]="false" />
  </div>

</div>
