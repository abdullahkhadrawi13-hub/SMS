<app-page-header
  [title]="'DASHBOARD.TITLE' | translate"
  [subtitle]="'DASHBOARD.PARENT.SUBTITLE' | translate"
/>


<!-- TEMPORARY: removed together with dashboard-sample-data.ts -->
<p class="sample-note" role="note">
  <mat-icon aria-hidden="true">info</mat-icon>
  <span>{{ 'DASHBOARD.SAMPLE_NOTE' | translate }}</span>
</p>


<div class="dashboard">

  <section class="dashboard-main children" aria-labelledby="children-title">
    <h2 id="children-title" class="section-title">{{ 'DASHBOARD.PARENT.CHILDREN' | translate }}</h2>

    @for (child of data.children; track child.studentId) {
      <app-child-card [child]="child" />
    } @empty {
      <p class="section-empty">{{ 'DASHBOARD.PARENT.NO_CHILDREN' | translate }}</p>
    }
  </section>

  <div class="dashboard-side">
    <app-notices-card [notices]="notices()" />
    <app-current-term-card [data]="term" [showYearsLink]="false" />
  </div>

</div>
