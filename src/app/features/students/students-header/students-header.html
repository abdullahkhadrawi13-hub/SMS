<app-page-header [title]="'STUDENTS.TITLE' | translate">

  <!-- The count under the title: every student, or the matching ones
       after a search or a filter. Shown once the list has loaded. -->
  @if (countKey(); as key) {
    <span subtitle>{{ key | translate: { count: count() } }}</span>
  }

  <!-- Add student (Admin only) -->
  @if (canManage()) {
    <button
      actions
      mat-flat-button
      color="primary"
      type="button"
      (click)="addStudent.emit()"
    >
      <mat-icon>person_add</mat-icon>

      {{ 'STUDENTS.ADD_STUDENT' | translate }}
    </button>
  }

</app-page-header>
