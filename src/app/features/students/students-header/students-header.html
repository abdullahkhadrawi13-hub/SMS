<!-- Page header: the title, one line describing the page, "Add student".
     The number of results is under the search (students-page),
     the total under the table (pagination). -->
<app-page-header
  [title]="'STUDENTS.TITLE' | translate"
  [subtitle]="'STUDENTS.SUBTITLE' | translate"
>

  <!-- Add student (Admin only) -->
  @if (canManage()) {
    <button
      actions
      mat-flat-button
      color="primary"
      type="button"
      (click)="addStudent.emit()"
    >
      <mat-icon>person_add</mat-icon>

      {{ 'STUDENTS.ADD_STUDENT' | translate }}
    </button>
  }

</app-page-header>
