<mat-form-field appearance="outline" class="search-field">

  <mat-label>
    {{ 'STUDENTS.SEARCH' | translate }}
  </mat-label>

  <input
    matInput
    [value]="search()"
    (input)="search.set($any($event.target).value)"
    [placeholder]="'STUDENTS.SEARCH_PLACEHOLDER' | translate"
    (keyup.enter)="searchSubmit.emit()"
  />

  @if (search()) {
    <button
      mat-icon-button
      matSuffix
      type="button"
      (click)="searchClear.emit()"
      [attr.aria-label]="'STUDENTS.CLEAR_SEARCH' | translate"
    >
      <mat-icon>close</mat-icon>
    </button>
  }

  <button
    mat-icon-button
    matSuffix
    type="button"
    (click)="searchSubmit.emit()"
    [attr.aria-label]="'STUDENTS.SEARCH_BUTTON' | translate"
  >
    <mat-icon>search</mat-icon>
  </button>

</mat-form-field>
