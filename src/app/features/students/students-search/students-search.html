<!-- Search: 36px field (44px on the phone), the search icon at the start.
     The list reloads by itself 400ms after the user stops typing;
     Enter searches straight away. -->
<label class="search-field">

  <span class="visually-hidden">
    {{ 'STUDENTS.SEARCH' | translate }}
  </span>

  <!-- The wrapper takes the page direction; <mat-icon> itself is always
       direction: ltr (styles.css), so it cannot be placed with inline-start. -->
  <span class="search-icon" aria-hidden="true">
    <mat-icon>search</mat-icon>
  </span>

  <input
    type="search"
    autocomplete="off"
    [value]="search()"
    [placeholder]="'STUDENTS.SEARCH_PLACEHOLDER' | translate"
    (input)="onInput($any($event.target).value)"
    (keydown.enter)="searchSubmit.emit()"
  />

  @if (search()) {
    <button
      type="button"
      class="clear-button"
      (click)="searchClear.emit()"
      [attr.aria-label]="'STUDENTS.CLEAR_SEARCH' | translate"
    >
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  }

</label>
