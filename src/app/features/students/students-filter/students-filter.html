<!-- Class (active classes; the teacher: only the classes he teaches) -->
<select
  class="filter-select"
  [class.is-active]="classId() !== null"
  [attr.aria-label]="'STUDENT_FILTER.CLASS' | translate"
  [disabled]="!classes().length"
  (change)="onClassChange($any($event.target).value)"
>
  <option value="" [selected]="classId() === null">
    {{ 'STUDENT_FILTER.ALL_CLASSES' | translate }}
  </option>

  @for (c of classes(); track c.schoolClassId) {
    <option [value]="c.schoolClassId" [selected]="c.schoolClassId === classId()">
      {{ getClassName(c) }}
    </option>
  }
</select>

<!-- Section (disabled until a class is chosen; the text says why) -->
<select
  class="filter-select is-wide"
  [class.is-active]="sectionId() !== null"
  [attr.aria-label]="'STUDENT_FILTER.SECTION' | translate"
  [disabled]="sectionDisabled()"
  (change)="onSectionChange($any($event.target).value)"
>
  <option value="" [selected]="sectionId() === null">
    {{ (classId() ? 'STUDENT_FILTER.ALL_SECTIONS' : 'STUDENT_FILTER.PICK_CLASS_FIRST') | translate }}
  </option>

  @for (s of sections(); track s.sectionId) {
    <!-- "الشعبة: أ": a bare letter alone would not say what it is -->
    <option [value]="s.sectionId" [selected]="s.sectionId === sectionId()">
      {{ 'STUDENT_FILTER.SECTION_OPTION' | translate: { name: getSectionName(s) } }}
    </option>
  }
</select>

<!-- Account status (independent of class and section) -->
<select
  class="filter-select"
  [class.is-active]="isActive() !== null"
  [attr.aria-label]="'SHARED.ACCOUNT.STATUS' | translate"
  (change)="onStatusChange($any($event.target).value)"
>
  <option value="" [selected]="statusValue() === ''">
    {{ 'STUDENT_FILTER.ALL_ACCOUNTS' | translate }}
  </option>
  <option value="true" [selected]="statusValue() === 'true'">
    {{ 'STUDENT_FILTER.ACCOUNT_OPTION' | translate: { name: ('SHARED.ACCOUNT.ACTIVE' | translate) } }}
  </option>
  <option value="false" [selected]="statusValue() === 'false'">
    {{ 'STUDENT_FILTER.ACCOUNT_OPTION' | translate: { name: ('SHARED.ACCOUNT.INACTIVE' | translate) } }}
  </option>
</select>
