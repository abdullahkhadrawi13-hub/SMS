<div class="student-list">

  <!-- Page Header -->
  <app-students-header
    (addStudent)="openAddStudent()"
  ></app-students-header>

  <!-- Search and Filter -->
  <div class="filters-card">

    <div class="search-container">

      <!-- Students Search -->
      <app-students-search
        [(search)]="search"
        (searchSubmit)="onSearch()"
        (searchClear)="clearSearch()"
      ></app-students-search>

      <!-- Filter -->
      <button
        mat-stroked-button
        type="button"
        (click)="openFilter()"
      >
        <mat-icon>filter_list</mat-icon>

        {{ 'STUDENTS.FILTER' | translate }}
      </button>

    </div>

  </div>

  <!-- Students Table (error / loading / table / empty state / pagination) -->
  <app-students-table
    [students]="students()"
    [classNames]="classNames()"
    [sectionNames]="sectionNames()"
    [isLoading]="isLoading()"
    [errorMessage]="errorMessage()"
    [totalCount]="totalCount()"
    [pageNumber]="pageNumber()"
    [pageSize]="pageSize()"
    (retry)="retry()"
    (pageChange)="onPageChange($event)"
    (viewStudent)="openStudentDetails($event)"
    (editStudent)="openEditStudent($event)"
    (toggleStatus)="toggleStudentStatus($event)"
  ></app-students-table>

</div>
