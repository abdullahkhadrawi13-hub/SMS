<!-- Title + academic term (the list only when there is more than one term) -->
<div class="tab-head">

  <h2 class="tab-title">
    {{ 'STUDENT_DETAILS.ATTENDANCE_TAB.TITLE' | translate }}
  </h2>

  @if (!loading() && !errorMessage() && termOptions().length > 1) {
    <app-attendance-term-select
      [options]="termOptions()"
      [value]="termId()"
      (valueChange)="termId.set($event)"
    />
  }

</div>


<!-- Loading -->
@if (loading()) {
  <app-state-card
    type="loading"
    [message]="'STUDENT_DETAILS.ATTENDANCE_TAB.LOADING' | translate"
  />
}

<!-- Error -->
@else if (errorMessage()) {
  <app-state-card
    type="error"
    [message]="errorMessage()"
    (retry)="loadHistory()"
  />
}

<!-- The student has no attendance records at all -->
@else if (!term()) {
  <app-state-card
    type="empty"
    icon="event_busy"
    [title]="'STUDENT_DETAILS.ATTENDANCE_TAB.EMPTY.TITLE' | translate"
    [message]="'STUDENT_DETAILS.ATTENDANCE_TAB.EMPTY.MESSAGE' | translate"
  />
}

<!-- One term: the numbers, the calendar and the days absent -->
@else if (term(); as term) {
  <app-term-attendance
    [records]="records()"
    [summaries]="summaries()"
    [term]="term"
    [weeklyDaysOff]="weeklyDaysOff()"
  />
}
