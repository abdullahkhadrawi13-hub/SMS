<div class="section-list">
  <!-- Page Header -->
  <app-sections-header
    (addSection)="openAddSectionDialog()"
  ></app-sections-header>

  <!-- Table Toolbar -->
  <div class="table-toolbar">
    <button mat-stroked-button type="button" class="filter-button" (click)="openFilterDialog()">
      <mat-icon>filter_list</mat-icon>

      <span>
        {{ 'SECTIONS.FILTER' | translate }}
      </span>
    </button>
  </div>

  <!-- Sections Table (error / table / empty state / pagination) -->
  <app-sections-table
    [sections]="sections()"
    [togglingSectionId]="togglingSectionId()"
    [errorMessage]="errorMessage()"
    [totalCount]="totalCount()"
    [pageNumber]="pageNumber()"
    [pageSize]="pageSize()"
    (pageChange)="onPageChange($event)"
    (editSection)="openEditSectionDialog($event)"
    (toggleStatus)="toggleSectionStatus($event)"
  ></app-sections-table>
</div>
